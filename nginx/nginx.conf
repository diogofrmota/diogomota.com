# Production config: HTTPS for diogomota.com, proxied to the app container.
# start.sh selects this file once the Let's Encrypt certificate exists;
# bootstrap.conf is used before that. Apply edits with:
#   docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload

user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;  # stderr in the official image

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;  # stdout in the official image

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    server_tokens off;
    client_max_body_size 5m;

    # Docker's embedded DNS. The app is resolved per request (proxy_pass with a
    # variable), so nginx starts without the app and follows it across redeploys,
    # when the container's IP can change.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/manifest+json application/xml
               application/rss+xml image/svg+xml;

    # TLS: Mozilla "intermediate" profile. No OCSP stapling: Let's Encrypt
    # certificates no longer carry an OCSP URL.
    ssl_certificate     /etc/letsencrypt/live/diogomota.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diogomota.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP, any host: ACME challenges for certbot, everything else to the apex over HTTPS.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://diogomota.com$request_uri;
        }
    }

    # HTTPS with an unknown or missing SNI name (e.g. https://<ip>/): refuse the handshake.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        ssl_reject_handshake on;
    }

    # www to the apex.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.diogomota.com;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        return 301 https://diogomota.com$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name diogomota.com;

        # Security headers live here, not in next.config, so they are not sent twice.
        # add_header is not inherited by blocks that set their own, so locations below
        # must not use it. The CSP only covers framing and plugins: a script policy for
        # Next.js needs per-request nonces, which belongs in the app.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

        set $app_upstream http://app:3000;

        location / {
            proxy_pass $app_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            # nginx is the edge, so overwrite rather than append: the app can trust
            # X-Forwarded-For to be exactly the client address (used for rate limits).
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Compression is done by nginx (gzip above), not by the Node server.
            proxy_set_header Accept-Encoding "";

            # Auth.js session cookies can exceed the default 4-8k header buffer
            # ("upstream sent too big header", a 502).
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;

            proxy_hide_header X-Powered-By;

            # Profile picture uploads: a phone photo can be several megabytes,
            # more than the 5m above. The app takes up to 20 MB
            # (lib/account-rules.ts, AVATAR_MAX_BYTES) and makes it small. The
            # proxy_set_header lines above apply here too; proxy_pass doesn't.
            location = /api/account/avatar {
                client_max_body_size 21m;
                proxy_pass $app_upstream;
            }
        }
    }
}

# Included in http. Never record query strings, referrers or bearer path segments.
map $uri $safe_route {
    default $uri;
    ~^/api/calendar(?:/|$) /api/calendar/[redacted];
    ~^/api/auth(?:/|$) /api/auth/[redacted];
    ~^/join(?:/|$) /join/[redacted];
}
log_format safe '$remote_addr [$time_local] "$request_method $safe_route" '
                '$status $body_bytes_sent rt=$request_time upstream=$upstream_response_time';
access_log /var/log/nginx/access.log safe;
# nginx's error formatter always appends raw request context and cannot redact
# it. Suppress request error logs; status/timing remain in the safe access log.
# The main-context error log still reports process/configuration failures.
error_log /dev/null;

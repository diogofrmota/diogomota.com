# HTTP-only config used until the first certificate exists (start.sh picks it).
# It only answers Let's Encrypt's HTTP challenge; infra/issue-cert.sh gets the
# certificate and then restarts nginx onto nginx.conf.

user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    server_tokens off;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            default_type text/plain;
            return 503 "diogomota.com is waiting for its TLS certificate (infra/issue-cert.sh).\n";
        }
    }
}

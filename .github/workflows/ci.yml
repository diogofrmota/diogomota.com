# Checks the app: formatting, lint, typecheck, the migration rules, unit tests and a
# build, isolated integration and behavioral tests, and production regressions.
# Pull requests and the normal main deployment gate both exercise the full suite.
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      e2e:
        description: "Which Playwright tests to run: all, or smoke (the walk through every view, and logging in)."
        type: string
        default: all

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # A migration may only drop or rename what the previous release stopped reading (README.md, Migrations).
      - run: npm run check:migrations
      - run: npm run test:unit
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # The tests' own dev server (playwright.config.ts).
      AUTH_URL: http://localhost:3100
      # Normal main deployments explicitly select all tests; smoke remains an
      # optional reusable-workflow input, never the normal deployment gate.
      E2E_ARGS: ${{ inputs.e2e == 'smoke' && 'views.spec.ts auth.spec.ts' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - name: A secret for this run's sessions
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      # E2E_ARGS is one of two fixed values above, never user input.
      - run: node scripts/run-e2e.mjs --integration
      - run: npm run test:e2e -- $E2E_ARGS
      - name: Production service worker and upload regressions
        run: npm run test:e2e -- --production production.spec.ts --project=desktop

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

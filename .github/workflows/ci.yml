# Checks the app: formatting, lint, typecheck, the migration rules, unit tests and a
# build, then the Playwright tests against a Postgres service. Runs on pull requests
# (every e2e test), and deploy.yml calls it (workflow_call) as the first job of
# every deploy, with a quicker set of e2e tests (smoke), so both run the same check.
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      e2e:
        description: "Which Playwright tests to run: all, or smoke (the walk through every view, and logging in)."
        type: string
        default: smoke

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # A migration may only drop or rename what the previous release stopped reading (README.md, Migrations).
      - run: npm run check:migrations
      - run: npm run test:unit
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diogomota
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: diogomota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U diogomota -d diogomota"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://diogomota:e2e@localhost:5432/diogomota
      # The tests' own dev server (playwright.config.ts).
      AUTH_URL: http://localhost:3100
      # Pull requests run every test; a deploy runs the smoke set (inputs.e2e).
      E2E_ARGS: ${{ inputs.e2e == 'smoke' && 'views.spec.ts auth.spec.ts' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - name: A secret for this run's sessions
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npm run migrate
      - run: npx playwright install --with-deps chromium
      # E2E_ARGS is one of two fixed values above, never user input.
      - run: npm run test:e2e -- $E2E_ARGS

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

# Production stack on the VPS, in /opt/diogomota (runbook: docs/deploy.md).
# Values come from .env next to this file (template: .env.production.example),
# which also sets COMPOSE_FILE so plain `docker compose ...` there uses this file.
name: diogomota

# Rotate container logs so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # No ports: only the other containers on this network can reach it.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: on first boot the image runs a temporary init server that only
      # listens on the Unix socket, which would report healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  app:
    image: diogofrmota/diogomota-com:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Built from the POSTGRES_* values so the password is set in one place.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  # Does not depend on app: nginx resolves app per request (see nginx/nginx.conf),
  # so it starts and serves certificates before the app exists, and returns 502
  # while the app is down.
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    # Picks nginx/nginx.conf once the certificate exists, nginx/bootstrap.conf before.
    command: ["/bin/sh", "/etc/nginx/site/start.sh"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/site:ro
      - certbot-webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    logging: *logging

  # One-off container for infra/issue-cert.sh and infra/renew-cert.sh; never runs
  # with `up` (the profile is only enabled when the service is named explicitly).
  certbot:
    image: certbot/certbot:v5.9.0
    profiles: ["certbot"]
    volumes:
      - certbot-webroot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    logging: *logging

networks:
  default:
    # The domain has an AAAA record. With IPv6 on this network, Docker forwards
    # IPv6 connections straight to nginx, keeping the client address.
    enable_ipv6: true

volumes:
  pgdata:
  certbot-webroot:
